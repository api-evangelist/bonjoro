apis:
- name: Bonjoro API V2
  description: >-
    REST API for the Bonjoro personal-video platform. Create and assign greets (video tasks) for one or
    many recipients, manage recipient profiles and campaigns/workspaces, upload recordings to presigned
    S3 URLs, apply message templates and branding, read engagement results, event streams and
    transmission/deliverability records, manage teams, users, invites, custom sending domains and
    verified email signatures, and build trigger/action automations against connected CRM and email
    services. OAuth 2.0 bearer tokens issued from /api/v2/oauth/2/token.
  humanURL: https://vimily.github.io/bonjoro-api-docs/
