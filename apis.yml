aid: bonjoro
name: Bonjoro
description: >-
  Bonjoro is a personal-video customer engagement platform operated by Vimily Pty Ltd of Sydney,
  Australia. Sales, marketing, customer success and education teams use it to record short one-to-one
  videos — "Bonjoros" — and deliver them at the moments that decide a relationship: signup, onboarding,
  first purchase, renewal and churn risk. Alongside the messaging product it runs a video testimonial
  collection surface. Bonjoro publishes a REST API (API V2, 94 paths and 123 operations) covering
  greets, recipient profiles, campaigns and workspaces, recordings and media, message templates,
  engagement results and stats, transmissions and deliverability, replies, teams and users, custom
  sending domains and verified signatures, and the trigger/action automation engine that wires Bonjoro
  into CRMs and email platforms. REST API access is published as a Company-tier entitlement; the wider
  integration surface runs through 18+ native connectors and a first-party Zapier app.
