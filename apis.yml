x-enrichment-notes:
  contract_discovery: >-
    The API host api.bonjoro.com is a Cloudflare-challenged dead end (403 "Just a moment..." on every
    path) and no developers/docs/status subdomain resolves. The real machine-readable contract was
    found on the third pass: Bonjoro's own API reference is a Redoc standalone bundle at
    https://vimily.github.io/bonjoro-api-docs/ (Vimily Pty Ltd is Bonjoro's operating company), with a
    complete OpenAPI 3.0.0 document — 94 paths, 123 operations, 126 schemas, 42 tags — embedded in the
    page's __redoc_state. It is saved verbatim in openapi/_original/.
  pointers_deliberately_withheld: >-
    No WellKnown or SecurityTxt (every /.well-known/ path 404s), no AgentCard (probed, absent), no
    MCPServer (no server exists — mcp/ holds a derived candidate only), no ToolCrosswalk (no MCP or
    GraphQL surface), no SDKs (no first-party client library in any registry), no Idempotency (no
    idempotency contract anywhere in 123 operations), no StatusPage (status.bonjoro.com has no DNS; the
    statuspage.io and instatus.com hosts are vendor catch-alls), no Deprecation (no policy, no Sunset
    header, no deprecated operation), no ChangeLog (/changelog redirects to the product login), no
    Security or Compliance (no disclosure policy, bug bounty, trust centre or named certification),
    no AsyncAPI (webhooks documented, no spec), no OAuthScopes (every requirement is an empty scope
    array).
