status_page:
  url: null
  note: >-
    Bonjoro operates no public status page. status.bonjoro.com does not resolve (no DNS).
    bonjoro.statuspage.io answers 200 but serves Atlassian's own Statuspage marketing page (title
    "Real-Time Incident Communication with Statuspage"), and bonjoro.instatus.com answers 200 with
    Instatus' "Get ready for downtime" placeholder — both are vendor catch-alls, not a Bonjoro status
    page. NO `StatusPage` pointer is emitted; a 200 on a vendor catch-all is not a status page.
