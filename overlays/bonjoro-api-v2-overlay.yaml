      x-access-tier: >-
        REST API access is published as a Company-tier (from $399/month) entitlement on
        https://www.bonjoro.com/pricing.
  - target: $.components
    update:
      securitySchemes:
        OAuth:
          type: oauth2
          description: >-
            Added by API Evangelist. The published contract references this scheme from 116 operations
            but never defines it. Values below are taken from the contract's own `authenticate`
            operation and `authenticationPayload` / `accessToken` schemas.
          flows:
            password:
              tokenUrl: https://www.bonjoro.com/api/v2/oauth/2/token
              scopes: {}
            clientCredentials:
              tokenUrl: https://www.bonjoro.com/api/v2/oauth/2/token
              scopes: {}
            authorizationCode:
              authorizationUrl: https://www.bonjoro.com/auth/login
              tokenUrl: https://www.bonjoro.com/api/v2/oauth/2/token
              scopes: {}
